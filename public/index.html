<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Inventory Manager</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-inner">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-10 2a2 2 0 100 4 2 2 0 000-4z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>Inventory Manager</span>
      </div>
      <div class="header-stats" id="headerStats">
        <span class="stat-badge" id="totalProducts">0 products</span>
        <span class="stat-badge low-stock" id="lowStockBadge" style="display:none">⚠ Low stock</span>
      </div>
      <button class="btn btn-primary" id="addProductBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Product
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Toolbar -->
    <div class="toolbar">
      <div class="search-wrap">
        <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" class="search-input" placeholder="Search products, SKU…" />
      </div>
      <select id="categoryFilter" class="select-filter">
        <option value="">All Categories</option>
      </select>
      <div class="view-toggle">
        <button class="view-btn active" id="gridViewBtn" title="Grid view" aria-label="Grid view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        </button>
        <button class="view-btn" id="listViewBtn" title="List view" aria-label="List view">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
      </div>
    </div>

    <!-- Products Grid -->
    <div id="productsContainer" class="products-grid"></div>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state" style="display:none">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/></svg>
      <p>No products found</p>
      <span>Try adjusting your search or add a new product</span>
    </div>
  </main>

  <!-- Add / Edit Modal -->
  <div id="productModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modalTitle">Add Product</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">&times;</button>
      </div>
      <form id="productForm" class="product-form" novalidate>
        <input type="hidden" id="productId" />
        <div class="form-row">
          <div class="form-group">
            <label for="fieldName">Product Name *</label>
            <input type="text" id="fieldName" placeholder="e.g. Wireless Mouse" required />
          </div>
          <div class="form-group">
            <label for="fieldSku">SKU *</label>
            <input type="text" id="fieldSku" placeholder="e.g. ELEC-006" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fieldCategory">Category *</label>
            <input type="text" id="fieldCategory" placeholder="e.g. Electronics" list="categoryList" required />
            <datalist id="categoryList"></datalist>
          </div>
          <div class="form-group">
            <label for="fieldPrice">Price (€) *</label>
            <input type="number" id="fieldPrice" placeholder="0.00" min="0" step="0.01" required />
          </div>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label for="fieldQuantity">Quantity *</label>
            <input type="number" id="fieldQuantity" placeholder="0" min="0" step="1" required />
          </div>
          <div class="form-group">
            <label for="fieldDescription">Description</label>
            <input type="text" id="fieldDescription" placeholder="Short description…" />
          </div>
        </div>
        <div id="formError" class="form-error" style="display:none"></div>
        <div class="modal-actions">
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="submit" class="btn btn-primary" id="saveBtn">Save Product</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirm Modal -->
  <div id="deleteModal" class="modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <div class="modal modal-sm">
      <div class="modal-header">
        <h2>Delete Product</h2>
        <button class="modal-close" id="deleteModalClose" aria-label="Close">&times;</button>
      </div>
      <p class="delete-confirm-text">Are you sure you want to delete <strong id="deleteProductName"></strong>? This action cannot be undone.</p>
      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" id="deleteCancelBtn">Cancel</button>
        <button type="button" class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="alert" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
